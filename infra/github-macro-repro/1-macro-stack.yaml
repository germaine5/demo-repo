AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deploys the GitHubInclude Lambda macro.
  Deploy this FIRST - it registers the macro so other templates can use it.

Parameters:
  GitHubToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      GitHub Personal Access Token with repo read access.
      Leave empty for public repos.

Resources:
  GitHubTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cfn/macro/github-token
      Description: GitHub PAT used by the GitHubInclude CFN macro
      SecretString: !Ref GitHubToken

  MacroLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubIncludeMacroRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadGitHubTokenSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GitHubTokenSecret

  MacroLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GitHubIncludeMacro
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MacroLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          SECRET_ARN: !Ref GitHubTokenSecret
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3
          import os

          def get_github_token():
              client = boto3.client("secretsmanager")
              secret = client.get_secret_value(SecretId=os.environ["SECRET_ARN"])
              value = secret["SecretString"]
              return value if value.strip() else None

          def fetch_github_file(owner, repo, path, ref, token):
              url = (
                  f"https://api.github.com/repos/{owner}/{repo}"
                  f"/contents/{path}?ref={ref}"
              )
              headers = {
                  "Accept": "application/vnd.github.v3.raw",
                  "User-Agent": "CFN-GitHubInclude-Macro",
              }
              if token:
                  headers["Authorization"] = f"token {token}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return resp.read().decode("utf-8")

          def handler(event, context):
              """
              Top-level macro handler. Receives the full template fragment.

              Finds any resource with Type: GitHubInclude::Snippet in the
              Resources section, fetches the JSON file from GitHub, and
              merges the returned resources into the Resources section,
              removing the marker resource.

              Snippet JSON format (flat map of CFN resources):
              {
                "LoggingBucket": { "Type": "AWS::S3::Bucket", ... },
                "LoggingBucketPolicy": { "Type": "AWS::S3::BucketPolicy", ... }
              }
              """
              print("Event:", json.dumps(event))
              try:
                  token    = get_github_token()
                  fragment = event["fragment"]
                  resources = fragment.get("Resources", {})

                  # Find all GitHubInclude::Snippet markers
                  markers = {
                      k: v for k, v in resources.items()
                      if v.get("Type") == "GitHubInclude::Snippet"
                  }

                  for marker_key, marker_val in markers.items():
                      props = marker_val.get("Properties", {})
                      owner = props["Owner"]
                      repo  = props["Repo"]
                      path  = props["Path"]
                      ref   = props.get("Ref", "main")

                      print(f"Fetching snippet: {owner}/{repo}/{path}@{ref}")
                      raw = fetch_github_file(owner, repo, path, ref, token)
                      snippet = json.loads(raw)

                      # Remove the marker resource
                      del resources[marker_key]

                      # Merge the snippet resources in its place
                      resources.update(snippet)
                      print(f"Injected resources: {list(snippet.keys())}")

                  fragment["Resources"] = resources

                  return {
                      "requestId": event["requestId"],
                      "status":    "success",
                      "fragment":  fragment,
                  }

              except Exception as e:
                  print(f"ERROR: {e}")
                  return {
                      "requestId":    event["requestId"],
                      "status":       "failure",
                      "errorMessage": str(e),
                  }

  MacroLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MacroLambda.Arn
      Action: lambda:InvokeFunction
      Principal: cloudformation.amazonaws.com

  GitHubIncludeMacro:
    Type: AWS::CloudFormation::Macro
    Properties:
      Name: GitHubInclude
      Description: >
        Fetches a JSON snippet from GitHub and merges its resources
        into the template Resources section at change set creation time.
      FunctionName: !GetAtt MacroLambda.Arn

Outputs:
  MacroName:
    Value: GitHubInclude
  MacroLambdaArn:
    Value: !GetAtt MacroLambda.Arn

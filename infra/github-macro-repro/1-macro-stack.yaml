AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deploys the GitHubInclude Lambda macro.
  Deploy this FIRST - it registers the macro so other templates can use it.

Parameters:
  GitHubToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      GitHub Personal Access Token with repo read access.
      Leave empty for public repos.

Resources:
  # -----------------------------------------------------------
  # Store the GitHub token in Secrets Manager
  # -----------------------------------------------------------
  GitHubTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cfn/macro/github-token
      Description: GitHub PAT used by the GitHubInclude CFN macro
      SecretString: !Ref GitHubToken

  # -----------------------------------------------------------
  # IAM Role for the macro Lambda
  # -----------------------------------------------------------
  MacroLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubIncludeMacroRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadGitHubTokenSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GitHubTokenSecret

  # -----------------------------------------------------------
  # Lambda function - stdlib only, no external dependencies
  # Snippet files must be JSON (not YAML) to avoid pyyaml dep
  # -----------------------------------------------------------
  MacroLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GitHubIncludeMacro
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MacroLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          SECRET_ARN: !Ref GitHubTokenSecret
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3
          import os

          def get_github_token():
              client = boto3.client("secretsmanager")
              secret = client.get_secret_value(SecretId=os.environ["SECRET_ARN"])
              value = secret["SecretString"]
              # Return None if empty so we skip the auth header
              return value if value.strip() else None

          def fetch_github_file(owner, repo, path, ref, token):
              """
              Fetch raw file from GitHub Contents API.
              Returns the raw bytes decoded as UTF-8 string.
              """
              url = (
                  f"https://api.github.com/repos/{owner}/{repo}"
                  f"/contents/{path}?ref={ref}"
              )
              headers = {
                  "Accept": "application/vnd.github.v3.raw",
                  "User-Agent": "CFN-GitHubInclude-Macro",
              }
              if token:
                  headers["Authorization"] = f"token {token}"

              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return resp.read().decode("utf-8")

          def process_fragment(fragment, token):
              """
              Recursively walk the template fragment.
              When a GitHubInclude Fn::Transform node is found,
              fetch the JSON file from GitHub and replace the node
              with the parsed content.

              Usage in template:
                Fn::Transform:
                  Name: GitHubInclude
                  Parameters:
                    Owner: germaine5
                    Repo:  demo-repo
                    Path:  infra/github-macro-repro/github-snippets/s3-logging-bucket.json
                    Ref:   main
              """
              if isinstance(fragment, dict):
                  if (
                      "Fn::Transform" in fragment
                      and isinstance(fragment["Fn::Transform"], dict)
                      and fragment["Fn::Transform"].get("Name") == "GitHubInclude"
                  ):
                      params = fragment["Fn::Transform"].get("Parameters", {})
                      owner = params["Owner"]
                      repo  = params["Repo"]
                      path  = params["Path"]
                      ref   = params.get("Ref", "main")

                      print(f"Fetching: github.com/{owner}/{repo}/{path}@{ref}")
                      raw = fetch_github_file(owner, repo, path, ref, token)
                      return json.loads(raw)

                  return {k: process_fragment(v, token) for k, v in fragment.items()}

              if isinstance(fragment, list):
                  return [process_fragment(item, token) for item in fragment]

              return fragment

          def handler(event, context):
              print("Event:", json.dumps(event))
              try:
                  token     = get_github_token()
                  fragment  = event["fragment"]
                  processed = process_fragment(fragment, token)
                  return {
                      "requestId": event["requestId"],
                      "status":    "success",
                      "fragment":  processed,
                  }
              except Exception as e:
                  print(f"ERROR: {e}")
                  return {
                      "requestId":    event["requestId"],
                      "status":       "failure",
                      "errorMessage": str(e),
                  }

  MacroLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MacroLambda.Arn
      Action: lambda:InvokeFunction
      Principal: cloudformation.amazonaws.com

  GitHubIncludeMacro:
    Type: AWS::CloudFormation::Macro
    Properties:
      Name: GitHubInclude
      Description: Fetches a JSON snippet from GitHub and injects it into the template
      FunctionName: !GetAtt MacroLambda.Arn

Outputs:
  MacroName:
    Value: GitHubInclude
  MacroLambdaArn:
    Value: !GetAtt MacroLambda.Arn

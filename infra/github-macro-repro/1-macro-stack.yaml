AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Deploys the GitHubInclude Lambda macro.
  Deploy this FIRST - it registers the macro so other templates can use it.

Parameters:
  GitHubToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      GitHub Personal Access Token with repo read access.
      Leave empty for public repos.

Resources:
  GitHubTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cfn/macro/github-token
      Description: GitHub PAT used by the GitHubInclude CFN macro
      SecretString: !Ref GitHubToken

  MacroLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubIncludeMacroRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadGitHubTokenSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GitHubTokenSecret

  MacroLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: GitHubIncludeMacro
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt MacroLambdaRole.Arn
      Timeout: 30
      Environment:
        Variables:
          SECRET_ARN: !Ref GitHubTokenSecret
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3
          import os

          def get_github_token():
              client = boto3.client("secretsmanager")
              secret = client.get_secret_value(SecretId=os.environ["SECRET_ARN"])
              value = secret["SecretString"]
              return value if value.strip() else None

          def fetch_github_file(owner, repo, path, ref, token):
              url = (
                  f"https://api.github.com/repos/{owner}/{repo}"
                  f"/contents/{path}?ref={ref}"
              )
              headers = {
                  "Accept": "application/vnd.github.v3.raw",
                  "User-Agent": "CFN-GitHubInclude-Macro",
              }
              if token:
                  headers["Authorization"] = f"token {token}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return resp.read().decode("utf-8")

          # ----------------------------------------------------------
          # PATTERN 1: Resource snippet injection
          # Finds resources with Type: GitHubInclude::Snippet and
          # replaces them with a flat map of CFN resources fetched
          # from GitHub as a JSON file.
          #
          # Usage in template:
          #   MySnippet:
          #     Type: GitHubInclude::Snippet
          #     Properties:
          #       Owner: germaine5
          #       Repo:  demo-repo
          #       Path:  snippets/s3-logging-bucket.json
          #       Ref:   main
          # ----------------------------------------------------------
          def inject_resource_snippets(fragment, token):
              resources = fragment.get("Resources", {})
              markers = {
                  k: v for k, v in resources.items()
                  if isinstance(v, dict) and v.get("Type") == "GitHubInclude::Snippet"
              }
              for marker_key, marker_val in markers.items():
                  props = marker_val.get("Properties", {})
                  owner = props["Owner"]
                  repo  = props["Repo"]
                  path  = props["Path"]
                  ref   = props.get("Ref", "main")
                  print(f"[Snippet] Fetching: {owner}/{repo}/{path}@{ref}")
                  raw     = fetch_github_file(owner, repo, path, ref, token)
                  snippet = json.loads(raw)
                  del resources[marker_key]
                  resources.update(snippet)
                  print(f"[Snippet] Injected: {list(snippet.keys())}")
              fragment["Resources"] = resources
              return fragment

          # ----------------------------------------------------------
          # PATTERN 2: Inline code injection
          # Recursively walks the entire template tree looking for
          # a dict with a single key "GitHubInclude::InlineCode".
          # Replaces it with the raw file content as a plain string.
          #
          # Usage in template (e.g. Lambda ZipFile):
          #   MyLambda:
          #     Type: AWS::Lambda::Function
          #     Properties:
          #       Code:
          #         ZipFile:
          #           GitHubInclude::InlineCode:
          #             Owner: germaine5
          #             Repo:  demo-repo
          #             Path:  src/handlers/my-function.py
          #             Ref:   main
          #
          # The entire ZipFile value becomes the raw Python/JS/etc code.
          # ----------------------------------------------------------
          def inject_inline_code(node, token):
              if isinstance(node, dict):
                  # Check if this dict IS an InlineCode marker
                  if list(node.keys()) == ["GitHubInclude::InlineCode"]:
                      props = node["GitHubInclude::InlineCode"]
                      owner = props["Owner"]
                      repo  = props["Repo"]
                      path  = props["Path"]
                      ref   = props.get("Ref", "main")
                      print(f"[InlineCode] Fetching: {owner}/{repo}/{path}@{ref}")
                      raw = fetch_github_file(owner, repo, path, ref, token)
                      print(f"[InlineCode] Injected {len(raw)} chars from {path}")
                      return raw  # replace the marker dict with the raw string
                  # Recurse into all values
                  return {k: inject_inline_code(v, token) for k, v in node.items()}
              if isinstance(node, list):
                  return [inject_inline_code(item, token) for item in node]
              return node

          def handler(event, context):
              print("Event:", json.dumps(event))
              try:
                  token    = get_github_token()
                  fragment = event["fragment"]

                  # Run both injection patterns
                  fragment = inject_resource_snippets(fragment, token)
                  fragment = inject_inline_code(fragment, token)

                  return {
                      "requestId": event["requestId"],
                      "status":    "success",
                      "fragment":  fragment,
                  }
              except Exception as e:
                  print(f"ERROR: {e}")
                  return {
                      "requestId":    event["requestId"],
                      "status":       "failure",
                      "errorMessage": str(e),
                  }

  MacroLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MacroLambda.Arn
      Action: lambda:InvokeFunction
      Principal: cloudformation.amazonaws.com

  GitHubIncludeMacro:
    Type: AWS::CloudFormation::Macro
    Properties:
      Name: GitHubInclude
      Description: >
        Fetches a JSON snippet from GitHub and merges its resources
        into the template Resources section at change set creation time.
      FunctionName: !GetAtt MacroLambda.Arn

Outputs:
  MacroName:
    Value: GitHubInclude
  MacroLambdaArn:
    Value: !GetAtt MacroLambda.Arn

AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Consumer template that uses the GitHubInclude macro to pull
  a reusable snippet from a GitHub repository and inject it
  into the Resources section at change set creation time.
  
  The macro is declared at the top level so it processes the
  ENTIRE template. It looks for any resource with Type:
  GitHubInclude::Snippet and replaces it with the fetched content.

Transform: GitHubInclude

Parameters:
  GitHubOwner:
    Type: String
    Default: germaine5
    Description: GitHub username or org
  GitHubRepo:
    Type: String
    Default: demo-repo
    Description: GitHub repository name
  GitHubRef:
    Type: String
    Default: main
    Description: Branch, tag or commit SHA to fetch from

Resources:
  # -----------------------------------------------------------
  # Marker resource - the macro replaces this entire resource
  # with the resources fetched from GitHub.
  # The macro recognises Type: GitHubInclude::Snippet and
  # expands it into the real resources.
  # -----------------------------------------------------------
  GitHubSnippet:
    Type: GitHubInclude::Snippet
    Properties:
      Owner: germaine5
      Repo: demo-repo
      Path: infra/github-macro-repro/github-snippets/s3-logging-bucket.json
      Ref: main

  # -----------------------------------------------------------
  # Regular resource that references the injected LoggingBucket
  # -----------------------------------------------------------
  AppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-app-data"
      LoggingConfiguration:
        DestinationBucketName: !Ref LoggingBucket
        LogFilePrefix: app-data/

Outputs:
  AppBucketName:
    Value: !Ref AppBucket
  LoggingBucketName:
    Value: !Ref LoggingBucket
